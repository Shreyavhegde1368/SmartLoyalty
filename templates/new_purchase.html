{% extends "base.html" %}{% block title %}Record purchase{% endblock %}
{% block content %}<section class="form-card"><h1>Record a purchase</h1><p class="muted">The customer must already have a SmartLoyalty account.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Customer email<input type="email" name="customer_email" required placeholder="customer@example.com"></label>
<label>Purchase amount (₹)<input type="number" name="amount" min="0.01" max="1000000" step="0.01" required></label>
<button class="button full">Save purchase & create feedback link</button></form>
<a class="muted small" href="{{ url_for('business_dashboard') }}">← Back to dashboard</a></section>{% endblock %}
