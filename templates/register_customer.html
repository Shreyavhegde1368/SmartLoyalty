{% extends "base.html" %}{% block title %}Join SmartLoyalty{% endblock %}
{% block content %}<section class="form-card"><h1>Create customer account</h1><p class="muted">Join participating businesses and keep your rewards together.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Full name<input name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Phone (optional)<input name="phone"></label>
<label>Password<input type="password" name="password" minlength="8" required></label>
<label class="check"><input type="checkbox" name="consent" value="yes"> I agree to receive optional offers by email.</label>
<button class="button full">Create account</button></form>
<p class="muted small">Already a member? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
