{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}<section class="form-card"><h1>Welcome back</h1><p class="muted">Sign in to your business or customer account.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button class="button full">Sign in</button></form>
<p class="muted small">New here? <a href="{{ url_for('register_customer') }}">Customer account</a> · <a href="{{ url_for('register_business') }}">Business account</a></p></section>{% endblock %}
